name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libgtest-dev

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          # Exclude integration tests: they require a running Infinispan
          # server via Docker, which CI does not provision.
          ctest --output-on-failure -LE integration

  test-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # vcpkg's x-gha binary cache (enabled by run-vcpkg) needs these two
      # runtime variables exported to the shell; they're available to Actions
      # internals but not to subsequent run steps unless exported here.
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # Pin to a recent vcpkg release (2026.07.29). Older baselines
          # reference MSYS2 packages (e.g. pkgconf) that the mirrors have
          # since deleted, causing 404s during vcpkg_fixup_pkgconfig.
          vcpkgGitCommitId: 'c76c06644034521fb761a39f8f52d8e87d1103d5'

      - name: Install dependencies
        run: |
          vcpkg install openssl:x64-windows gtest:x64-windows

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Run unit tests
        run: |
          cd build
          # Exclude integration tests: they require a running Infinispan
          # server via Docker, which CI does not provision.
          ctest -C Release --output-on-failure -LE integration

  test-fedora:
    name: Linux (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          dnf install -y cmake gcc-c++ openssl-devel gtest-devel

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          # Exclude integration tests: they require a running Infinispan
          # server via Docker, which CI does not provision.
          ctest --output-on-failure -LE integration
